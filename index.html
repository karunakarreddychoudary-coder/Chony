<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Experience | Vercel Static</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow {
            box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[350px] bg-gradient-to-tr from-brand-600/30 to-purple-600/20 blur-[120px] rounded-full pointer-events-none -z-10"></div>

    <header class="sticky top-0 z-50 px-6 py-4">
        <nav class="max-w-5xl mx-auto glass rounded-2xl px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
                <span class="w-3 h-3 rounded-full bg-brand-500 animate-pulse"></span>
                <span>Vercel<span class="text-neutral-500">Static</span></span>
            </div>
            <div class="flex items-center gap-6 text-sm font-medium text-neutral-400">
                <a href="#features" class="hover:text-white transition-colors">Features</a>
                <a href="#about" class="hover:text-white transition-colors">About</a>
                <a href="https://github.com" target="_blank" class="glass px-4 py-2 rounded-xl text-white hover:bg-white/10 transition-all flex items-center gap-2">
                    <i data-lucide="github" class="w-4 h-4"></i> GitHub
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-24 text-center flex-1 flex flex-col justify-center items-center">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass text-xs font-semibold text-brand-500 mb-8 border border-brand-500/20">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Pure Static • Ultra Speed
        </div>
        
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight leading-tight mb-6">
            Build sleek sites with <br/>
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-brand-500 via-purple-400 to-pink-500">
                zero complexity.
            </span>
        </h1>
        
        <p class="text-lg md:text-xl text-neutral-400 max-w-2xl mb-10 leading-relaxed">
            Direct GitHub sync to Vercel static edge nodes. Instant deployments, perfect Lighthouse scores, and minimal setup.
        </p>

        <div class="flex flex-col sm:flex-row items-center gap-4">
            <a href="#" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold transition-all glow flex items-center justify-center gap-2">
                Get Started <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
            <a href="#" class="w-full sm:w-auto px-8 py-3.5 rounded-xl glass hover:bg-white/10 text-neutral-300 font-semibold transition-all">
                Documentation
            </a>
        </div>
    </main>

    <footer class="border-t border-neutral-900 py-8 px-6 text-center text-sm text-neutral-500">
        <p>© 2026 Deployed via Vercel Edge Network.</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
